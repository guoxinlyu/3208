version: "3.9"
services:
  web:
    build: .
    image: myapp-web
    ports: ["5173:80"]         # 浏览器访问 http://localhost:5173
    depends_on: [api]

  api:
    build: ./api
    image: myapp-api
    environment:
      PGHOST: postgres
      PGUSER: appuser
      PGPASSWORD: apppass
      PGDATABASE: appdb
      PGPORT: "5432"
      JWT_SECRET: "dev-secret-please-change"
    ports: ["3000:3000"]
    depends_on: [postgres]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro

volumes:
  pgdata:
