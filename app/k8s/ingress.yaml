apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autoshow-ing
  namespace: autoshow
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend: { service: { name: web-svc, port: { number: 80 } } }
      - path: /api
        pathType: Prefix
        backend: { service: { name: api-svc, port: { number: 3000 } } }
