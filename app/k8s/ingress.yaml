# GKE HTTP(S) Ingress (GCE controller) with path-based routing
# AI assistance: ChatGPT (GPT-5 Thinking) used on 2025-10-22 to review path rules and GCE ingress class.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autoshow-ing
  namespace: autoshow
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend: { service: { name: web-svc, port: { number: 80 } } }
      - path: /api
        pathType: Prefix
        backend: { service: { name: api-svc, port: { number: 3000 } } }
