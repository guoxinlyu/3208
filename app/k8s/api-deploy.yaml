apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: autoshow
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
      - name: api
        # 替换 PROJECT_ID
        image: us-east1-docker.pkg.dev/PROJECT_ID/apps/api:1.0.0
        ports: [{ containerPort: 3000 }]
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        readinessProbe: { httpGet: { path: /healthz, port: 3000 }, initialDelaySeconds: 5 }
        livenessProbe:  { httpGet: { path: /healthz, port: 3000 }, initialDelaySeconds: 10 }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { cpu: 500m, memory: 512Mi }
      # 若用 Cloud SQL，可在这里加 cloud-sql-proxy sidecar（之后我可以给你专版）
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: autoshow
spec:
  selector: { app: api }
  ports: [ { port: 3000, targetPort: 3000 } ]
  type: ClusterIP
