apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: autoshow
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      # ✅（可选，长期更安全）启用后请创建并绑定 api-k8s-sa ↔ GSA
      # serviceAccountName: api-k8s-sa

      containers:
        - name: api
          image: us-east1-docker.pkg.dev/centered-center-471311-q2/apps/api:1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"

            # ✅ 改为 PG*，与 db.js 的读取一致
            - name: PGHOST
              value: "127.0.0.1"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: db-credentials, key: DB_NAME } }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: db-credentials, key: DB_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: DB_PASS } }

          # ✅ 探针路径修成 /healthz（与你的 index.js 一致）
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }

        - name: cloud-sql-proxy
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
      args:
       - "--structured-logs"
       - "--port=5432"
       - "--private-ip"          # 如果 Cloud SQL 开启私网，否则删掉这一行
       - "centered-center-471311-q2:us-east1:guoxin"
      securityContext:
       runAsNonRoot: true


---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: autoshow
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP   

